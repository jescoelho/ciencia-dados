<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jéssica Coelho — Ciência de Dados">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#c9c0f2" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#dcd6f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#dcd6f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3aa7"/>
      <stop offset="100%" stop-color="#8f7fe0"/>
    </linearGradient>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a48c2"/>
      <stop offset="100%" stop-color="#3c2f8a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#faf9f7"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- decorative motif: layered translucent echoes of the mark's blob shape, tucked into corners -->
  <g transform="translate(80,560) scale(1.5) rotate(-12)" opacity="0.09">
    <path d="M92,18 C124,14 156,34 162,66 C168,100 154,132 122,150 C90,168 52,164 30,138 C10,114 12,78 30,52 C46,28 66,22 92,18 Z" fill="#4a3aa7"/>
  </g>
  <g transform="translate(1180,80) scale(1.3) rotate(18)" opacity="0.10">
    <path d="M92,18 C124,14 156,34 162,66 C168,100 154,132 122,150 C90,168 52,164 30,138 C10,114 12,78 30,52 C46,28 66,22 92,18 Z" fill="#8f7fe0"/>
  </g>

  <!-- logo mark: organic blob + "Jc" ligature, centered top -->
  <g transform="translate(524.3,21.7) scale(1.3)">
    <path d="M92,18 C124,14 156,34 162,66 C168,100 154,132 122,150 C90,168 52,164 30,138 C10,114 12,78 30,52 C46,28 66,22 92,18 Z" fill="url(#monoGrad)"/>
    <path d="M58,40 L58,118 C58,138 44,146 28,140" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.96"/>
    <path d="M138,58 C130,44 110,38 92,46 C72,55 64,78 72,98 C80,118 102,128 122,120 C132,116 139,108 142,98" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.96"/>
  </g>

  <!-- text block, centered -->
  <text x="640" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#4a3aa7">CIÊNCIA DE DADOS</text>
  <rect x="605" y="324" width="70" height="3" rx="1.5" fill="url(#barGrad)"/>

  <text x="640" y="404" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#15121c">Jéssica Coelho</text>

  <text x="640" y="448" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="500" fill="#5c5866">Estudos e projetos aplicados</text>

  <!-- bottom accent bar -->
  <rect x="0" y="636" width="1280" height="4" fill="url(#barGrad)"/>
</svg>
